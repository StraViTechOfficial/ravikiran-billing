<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ravi Kiran Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: fixed dark sidebar (top bar on phones) + one working column; machine-yellow marks the primary action. */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --sunk:#F6F7F8; --ink:#1B2229; --muted:#5D6873; --line:#D9DDE2;
  --side:#1B2229; --side-ink:#C9D0D7; --side-active:#2A333D;
  --accent:#F2B705; --accent-ink:#1B2229; --accent-soft:#FDF3CF;
  --good:#1E7F48; --good-soft:#DFF3E7; --warn:#9A6200; --warn-soft:#FCEFD3; --bad:#B4380F; --bad-soft:#FBE3DA;
  --info:#24598F; --info-soft:#E1ECF7;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --doc:"Carlito",Calibri,"Segoe UI",Arial,sans-serif;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111519; --surface:#192026; --sunk:#151B20; --ink:#E5E9ED; --muted:#97A2AD; --line:#2B343D;
  --side:#0B0E11; --side-ink:#AEB8C2; --side-active:#1F272F;
  --accent:#F5C12E; --accent-ink:#14181C; --accent-soft:#3A3115;
  --good:#5CC88A; --good-soft:#163323; --warn:#E9B04C; --warn-soft:#3A2C10; --bad:#F08A63; --bad-soft:#3D1D12;
  --info:#7DB2E8; --info-soft:#15283B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111519; --surface:#192026; --sunk:#151B20; --ink:#E5E9ED; --muted:#97A2AD; --line:#2B343D;
  --side:#0B0E11; --side-ink:#AEB8C2; --side-active:#1F272F;
  --accent:#F5C12E; --accent-ink:#14181C; --accent-soft:#3A3115;
  --good:#5CC88A; --good-soft:#163323; --warn:#E9B04C; --warn-soft:#3A2C10; --bad:#F08A63; --bad-soft:#3D1D12;
  --info:#7DB2E8; --info-soft:#15283B; color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,td.r,.tile b{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:36px;height:36px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 15px var(--display)}
.brand b{display:block;color:#fff;font:700 15px/1.2 var(--display)}
.brand small{font-size:12px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:6px;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-active);color:#fff}
.nav a.on{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:12px;padding:0 6px;opacity:.8}
.main{padding:28px 32px 60px;min-width:0;max-width:1280px;width:100%}

/* page parts */
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.crumb{display:inline-block;margin-bottom:6px;color:var(--muted);text-decoration:none;font-size:14px}
.crumb:hover{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.small{min-height:34px;padding:4px 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.block{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--info);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.panel-head p{margin:0;color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;align-items:start}
.grid-side{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:1100px){.grid-side{grid-template-columns:minmax(0,1fr)}}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:14px;color:var(--muted);font-weight:600}
.tile b{font:800 1.5rem/1.2 var(--display)}
.tile small{color:var(--muted);font-size:14px}
.tile b.warn{color:var(--warn)}
.tile.hi{border-color:var(--accent);background:var(--accent-soft)}
.tile.alert b{color:var(--bad)}
a.tile{text-decoration:none;color:inherit}
.seg a{display:inline-block;padding:7px 14px;border-radius:5px;font-weight:600;color:var(--muted);text-decoration:none}
.seg a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}


.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:22px}
.quick .btn{min-height:54px;justify-content:flex-start;font-size:15px}
.quick .btn i{font-style:normal;font:800 20px/1 var(--display);width:26px;height:26px;border-radius:5px;display:grid;place-items:center;background:var(--sunk)}
.quick .btn.primary i{background:rgba(0,0,0,.12)}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.tbl .sub{display:block;color:var(--muted);font-size:14px}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line)}

.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:5px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{flex:1;min-width:200px;max-width:340px}

.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:42px;padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input[readonly]{background:var(--sunk)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.errors{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:10px 14px;font-weight:500}
.errors ul{margin:4px 0 0;padding-left:18px}

/* bill editor */
.line-card{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:16px;display:flex;flex-direction:column;gap:14px}
.line-card .line-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.line-card .line-top h3 span{color:var(--muted);font-weight:500}
.entries{width:100%;border-collapse:collapse;font-size:14px}
.entries th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:0 6px 6px}
.entries td{padding:3px 6px}
.entries .input{min-height:38px}
.entries td.x{width:40px}
.line-total{display:flex;justify-content:flex-end;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.line-total b{color:var(--ink);font-variant-numeric:tabular-nums}
.totals{display:flex;flex-direction:column;gap:6px;font-size:14px}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .grand{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px;font:800 1.25rem var(--display)}
.totals .words{font-size:12px;color:var(--muted);display:block}
.sticky{position:sticky;top:20px}
@media (max-width:860px){.sticky{position:static}}

/* bill view */
.paper{background:#E3E5E8;border-radius:var(--r);padding:18px;overflow-x:auto}
.summary-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.summary-row b{font-variant-numeric:tabular-nums}
.summary-row.big b{font:800 1.3rem var(--display)}
.pay-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.pay-item small{display:block;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,14,18,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.modal-card{background:var(--surface);border-radius:10px;width:100%;max-width:620px;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-card.narrow{max-width:440px}
.modal-card h2{margin-bottom:16px;font-size:1.25rem}
.who{display:flex;gap:12px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;flex-wrap:wrap}
.who-av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 16px var(--display);flex:none}
.who-main{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;font-size:14px;color:var(--muted)}
.who-main b{color:var(--ink);font-size:16px}
.who-r{margin-left:auto;text-align:right;display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.who-r b{font:800 1.25rem var(--display)}
.field-label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.rseg{display:flex;flex-wrap:wrap;gap:8px}
.rseg label{position:relative}
.rseg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.rseg span{display:inline-flex;align-items:center;min-height:44px;padding:6px 18px;border:1px solid var(--line);border-radius:999px;font-weight:600;background:var(--surface)}
.rseg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rseg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.billpick{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;background:var(--surface)}
.billpick+.billpick{margin-top:8px}
.billpick input{width:20px;height:20px;accent-color:var(--ink);flex:none;margin:0}
.billpick:has(input:checked){border-color:var(--ink);box-shadow:inset 4px 0 0 var(--accent)}
.bp-main{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px;color:var(--muted)}
.bp-main b{color:var(--ink);font-size:15px}
.bp-r{text-align:right;display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.bp-r b{font:800 1.1rem var(--display)}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:34px}
.dchip:hover{border-color:var(--ink)}
.input.big{font:800 1.4rem var(--display);min-height:54px}
.input.active{border-color:var(--ink);background:var(--accent-soft)}
.modal .eq{margin:16px 0 0;gap:8px}
.modal .eq-item{flex-basis:110px;padding:10px 12px}
.modal .eq-item b{font-size:1.15rem}
.modal .eq .op{font-size:1.3rem}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}}


/* sums: [box] − [box] = [box] */
.sec{font-size:1rem;color:var(--muted);margin:0 0 10px}
.eq{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;margin-bottom:20px}
.eq-item{flex:1 1 170px;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;text-align:left;font:inherit}
.eq-item span{font-size:14px;font-weight:600;color:var(--muted)}
.eq-item b{font:800 1.65rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.eq-item small{font-size:14px;color:var(--muted)}
.eq-item.good b,.t-good{color:var(--good)}
.eq-item.bad b,.t-bad{color:var(--bad)}
.eq-item.warn b,.t-warn{color:var(--warn)}
.eq-item.on{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--accent)}
.eq-sep{width:1px;background:var(--line);margin:0 10px}
.eq .op{align-self:center;font:800 1.7rem var(--display);color:var(--muted);min-width:18px;text-align:center}
.go{cursor:pointer;transition:border-color .15s}
.go:hover{border-color:var(--ink)}
.go::after{content:"›";position:absolute;top:10px;right:14px;font:700 22px/1 var(--display);color:var(--muted)}
.go:hover::after{color:var(--ink)}
a.tile{position:relative}
.fchip{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:6px 14px;border-radius:999px;border:1px solid var(--ink);background:var(--accent-soft);font-weight:600;cursor:pointer}
.big-phone{font:700 1.3rem var(--display);margin:0 0 10px;user-select:all}

/* bill editor: a sheet laid out like the paper bill */
.sheet-panel{padding:0;overflow:hidden}
.sheet-top{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--sunk)}
.co-pick{display:flex;align-items:center;gap:10px}
.co-pick label{font-size:13px;font-weight:600;color:var(--muted)}
.co-pick .input{min-width:220px}
.party-ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--line)}
.party-ed>div{padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.party-ed>div+div{border-left:1px solid var(--line)}
@media (max-width:820px){.party-ed{grid-template-columns:1fr}.party-ed>div+div{border-left:0;border-top:1px solid var(--line)}}
.pe-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.client-card{background:var(--sunk);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.55}
.client-card b{color:var(--ink)}
.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.form-grid.two{grid-template-columns:1fr}}
.sheet-wrap{overflow-x:auto;padding:16px 20px 10px}
table.sheet{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
.sheet th,.sheet td{border:1px solid var(--line)}
.sheet th{background:var(--sunk);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:9px 8px;white-space:nowrap}
.sheet th.r{text-align:right}.sheet th.c{text-align:center}
.sheet td{padding:4px;vertical-align:top}
.sheet .input{min-height:36px;padding:6px 8px;border-color:transparent;background:var(--sunk);border-radius:4px}
.sheet .input:hover{border-color:var(--line)}
.sheet .input:focus{border-color:var(--ink);background:var(--surface)}
.sheet select.input{border-color:var(--line)}
.sheet td.sr{width:44px;text-align:center;font-weight:700;color:var(--muted);padding-top:12px}
.sheet td.desc{width:320px}
.desc-ed{display:flex;flex-direction:column;gap:4px}
.desc-ed .input[data-f$="description"]{font-weight:600}
.desc-row{display:flex;gap:4px}
.sheet td.rate{width:140px}
.sheet td.rate .input,.sheet input[data-qty]{text-align:right}
.sheet .per{display:block;font-size:12px;color:var(--muted);text-align:right;padding:0 8px}
.sheet td.amt{width:130px;text-align:right;font-weight:700;padding:12px 10px 0;white-space:nowrap;font-variant-numeric:tabular-nums}
.sheet td.x{width:46px;text-align:center}
.sheet td.r{text-align:right}
.sheet tr.sub td{background:var(--sunk);font-size:13px;padding:6px 10px;color:var(--muted)}
.sheet tr.sub b{color:var(--ink)}
.qty-cell{display:flex;gap:2px;align-items:center}
.qty-cell .btn{min-height:30px;padding:2px 8px}
.xsp{width:34px;flex:none}
.add-line-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:0 20px 16px}
.add-line-row .hint{font-size:12px;color:var(--muted)}
.bill-foot{display:grid;grid-template-columns:minmax(0,1fr) 360px;border-top:1px solid var(--line)}
.bill-foot>div{padding:18px 20px;min-width:0}
.bill-foot>div+div{border-left:1px solid var(--line);background:var(--sunk)}
@media (max-width:900px){.bill-foot{grid-template-columns:1fr}.bill-foot>div+div{border-left:0;border-top:1px solid var(--line)}}
.words-box{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.words-box span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.words-box b{font-weight:600}
.tot-box{display:flex;flex-direction:column;gap:8px;font-size:14px}
.tot-box>div:not(.totals){display:flex;justify-content:space-between;align-items:center;gap:12px}
.tot-box label{font-weight:500}

function suggestNumber(co, type) {

/* ---------------- money ---------------- */
const lineQty = l => r2(l.entries.reduce((s, e) => s + parseQty(e.qty), 0));
const lineAmt = l => r2(lineQty(l) * (+l.rate || 0));
function calc(b) {
  const co = company(b.companyId) || {};
  const sub = r2(b.lines.reduce((s, l) => s + lineAmt(l), 0));
  const transport = r2(+b.transport || 0);
  const diesel = r2((+b.dieselL || 0) * (+b.dieselRate || 0));
  const taxable = r2(sub + transport + diesel);
  let cgst = 0, sgst = 0, igst = 0;
  if (co.gst) {
    const cl = client(b.clientId);
    const other = cl && cl.gstin && co.gstin && cl.gstin.slice(0, 2) !== co.gstin.slice(0, 2);
    if (other) igst = r2(taxable * 0.18); else { cgst = r2(taxable * 0.09); sgst = cgst; }
  }
  const raw = r2(taxable + cgst + sgst + igst);
  const grand = Math.round(raw);
  return {sub, transport, diesel, taxable, cgst, sgst, igst, roundOff: r2(grand - raw), grand};
}
const received = b => r2((b.payments || []).reduce((s, p) => s + (+p.amount || 0) + (+p.tds || 0), 0));
const balance = b => b.type === 'invoice' ? Math.max(0, r2(calc(b).grand - received(b))) : 0;
function billStatus(b) {
  if (b.type !== 'invoice') return (b.convertedTo || []).some(bill) ? ['Converted', ''] : ['Open', 'info'];
  const g = calc(b).grand, rec = received(b);
  if (rec >= g - 0.5) return ['Paid', 'good'];
  const d = daysBetween(b.date, TODAY);
  if (rec > 0) return [`Part paid · ${d} days`, d > 45 ? 'bad' : 'warn'];
  return [`Not paid · ${d} days`, d > 45 ? 'bad' : 'warn'];
}

function salaryDue(e) {

  const days = daysInMonth(m), allow = Math.round(days * e.allowance), total = e.salary + allow, adv = Math.max(0, advanceDue(e));
  return {m, days, salary: e.salary, allow, total, adv, toPay: Math.max(0, total - adv), carry: Math.max(0, adv - total)};
}

function vstats(vid, p = 'all') {
  let work = 0, earned = 0;
  invoices().forEach(b => b.lines.forEach(l => { if (l.vehicleId !== vid) return;
    l.entries.forEach(e => { const q = parseQty(e.qty); if (q > 0 && inPeriod(e.date || b.date, p)) { work += q; earned += q * (+l.rate || 0); } }); }));
  const fills = DB.diesel.filter(f => f.vehicleId === vid && inPeriod(f.date, p)).sort((a, b) => b.date.localeCompare(a.date));
  const litres = r2(fills.reduce((s, f) => s + (+f.litres || 0), 0)), cost = r2(fills.reduce((s, f) => s + (+f.amount || 0), 0));
  const v = vehicle(vid), avg = work ? r2(litres / work) : 0;
  return {work: r2(work), earned: r2(earned), litres, cost, fills, avg, after: r2(earned - cost), high: !!(v && v.dieselNorm && work && avg > v.dieselNorm * 1.15)};
}

function fieldHTML(f) {
  const v = f.value ?? '';
  const id = 'f_' + f.id;
  let ctl;
  if (f.type === 'select') ctl = `<select class="input" id="${id}" name="${f.id}">${f.options.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
  else if (f.type === 'textarea') ctl = `<textarea class="input" id="${id}" name="${f.id}">${esc(v)}</textarea>`;
  else ctl = `<input class="input" id="${id}" name="${f.id}" type="${f.type || 'text'}" value="${esc(v)}" ${f.type === 'number' ? 'step="any" min="0" inputmode="decimal"' : ''} ${f.readonly ? 'readonly' : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>`;
  return `<div class="field ${f.full ? 'full' : ''}"><label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>${ctl}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
}
function openForm({title, fields, submit = 'Save', onSubmit, narrow}) {
  openModal(`<h2>${esc(title)}</h2><form id="mform" novalidate><div id="merr"></div><div class="form-grid">${fields.map(fieldHTML).join('')}</div>
    <div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">${esc(submit)}</button></div></form>`, narrow);
  $('#mform').addEventListener('submit', e => {
    e.preventDefault();
    const vals = Object.fromEntries(new FormData(e.target).entries());
    for (const k in vals) vals[k] = String(vals[k]).trim();
    const missing = fields.filter(f => f.required && !vals[f.id]).map(f => f.label);
    if (missing.length) { $('#merr').innerHTML = `<div class="errors" style="margin-bottom:14px">Please fill: ${missing.map(esc).join(', ')}</div>`; return; }
    const err = onSubmit(vals);
    if (err) { $('#merr').innerHTML = `<div class="errors" style="margin-bottom:14px">${esc(err)}</div>`; return; }
    closeModal();
  });
}

function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(c => { const s = String(c ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();

function eq(parts, id) {
  return `<div class="eq">${parts.map(p => {
    if (p === '|') return '<span class="eq-sep" aria-hidden="true"></span>';
    if (typeof p === 'string') return `<span class="op" aria-hidden="true">${p}</span>`;
    const inner = `<span>${p.label}</span><b>${p.value}</b>${p.sub ? `<small>${p.sub}</small>` : ''}`;
    const cls = `eq-item ${p.tone || ''} ${p.on ? 'on' : ''}`;
    if (p.href) return `<a class="${cls} go" href="${p.href}">${inner}</a>`;
    if (p.act) return `<button type="button" class="${cls} go" data-act="${p.act}" data-val="${p.val}" data-id="${id || ''}">${inner}</button>`;
    return `<div class="${cls}">${inner}</div>`;
  }).join('')}</div>`;
}

function renderBills() {
  const f = billFilter, q = f.q.toLowerCase();
  const isInv = !['quotation', 'proforma'].includes(f.tab);
  const list = DB.bills.filter(b => (isInv ? b.type === 'invoice' && (f.tab === 'all' || (f.tab === 'pending' ? balance(b) > 0.5 : balance(b) <= 0.5)) : b.type === f.tab)
    && (f.company === 'all' || b.companyId === f.company) && inPeriod(b.date, f.period)
    && (!q || [b.number, client(b.clientId)?.name, siteOf(client(b.clientId), b.siteId)?.name, ...b.lines.map(l => l.description)].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  const total = list.reduce((t, b) => t + calc(b).grand, 0), rec = list.reduce((t, b) => t + (isInv ? received(b) : 0), 0), pend = list.reduce((t, b) => t + balance(b), 0);
  const tab = (v, l) => `<button data-filter="tab" data-val="${v}" class="${f.tab === v ? 'on' : ''}">${l}</button>`;
  main.innerHTML = `
  <div class="page-head"><div><h1>Bills</h1></div>
    <div class="actions"><button class="btn" data-act="csv-bills">Excel</button><a class="btn" href="#bill/new/quotation">+ Quotation</a><a class="btn primary" href="#bill/new/invoice">+ New bill</a></div></div>
  <div class="toolbar">
    <div class="seg">${tab('all', 'All bills')}${tab('pending', 'Not paid')}${tab('paid', 'Paid')}${tab('quotation', 'Quotations')}${tab('proforma', 'Proforma')}</div>
    <select class="input" id="bill-co" style="max-width:190px" aria-label="Company"><option value="all">Both companies</option>${DB.companies.map(c => `<option value="${c.id}" ${f.company === c.id ? 'selected' : ''}>${esc(c.short)}</option>`).join('')}</select>
    <input class="input search" id="bill-q" placeholder="Search client, bill no, vehicle" value="${esc(f.q)}">
    <select class="input${f.period !== 'all' ? ' active' : ''}" id="bill-dt" style="max-width:190px" aria-label="Date">${[['all', 'Any date'], ['fy', periodLabel('fy')], ['month', periodLabel('month')]].map(([v, l]) => `<option value="${v}" ${f.period === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
  </div>
  ${isInv ? eq([{label: 'Bill amount', value: rs(total), sub: `${pl(list.length, 'bill', 'bills')}`}, '−', {label: 'Received', value: rs(rec), tone: 'good'}, '=', {label: 'Pending amount', value: rs(pend), tone: pend > 0.5 ? 'bad' : 'good'}])
    : eq([{label: f.tab === 'quotation' ? 'Quotations' : 'Proforma invoices', value: list.length}, {label: 'Total value', value: rs(total)}])}
  <section class="panel">
  ${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Bill</th><th>Client</th><th class="r">Amount</th>${isInv ? '<th class="r">Pending</th>' : ''}<th>Status</th></tr></thead><tbody>
  ${list.map(b => { const cl = client(b.clientId); return `<tr class="click" data-href="#bill/${b.id}">
    <td><b>${esc(b.number)}</b><span class="sub">${dmy(b.date)} · ${esc(company(b.companyId)?.short)}</span></td>
    <td><b>${esc(cl?.name || '—')}</b><span class="sub">${esc(b.lines.map(l => l.description).join(', '))}</span></td>
    <td class="r"><b>${rs(calc(b).grand)}</b></td>${isInv ? `<td class="r">${balance(b) > 0.5 ? `<b class="t-bad">${rs(balance(b))}</b>` : '—'}</td>` : ''}<td>${chip(billStatus(b))}</td></tr>`; }).join('')}
  </tbody><tfoot><tr><td colspan="2">Total</td><td class="r">${rs(total)}</td>${isInv ? `<td class="r">${rs(pend)}</td>` : ''}<td></td></tr></tfoot></table></div>`
    : `<div class="empty"><b>No bills here</b></div>`}
  </section>`;
  const qi = $('#bill-q');
  qi.addEventListener('input', () => { billFilter.q = qi.value; const pos = qi.selectionStart; renderBills(); const n = $('#bill-q'); n.focus(); n.setSelectionRange(pos, pos); });
  $('#bill-co').addEventListener('change', ev => { billFilter.company = ev.target.value; renderBills(); });
  $('#bill-dt').addEventListener('change', ev => { billFilter.period = ev.target.value; renderBills(); });
}

function receiveMoneyForm(cid, bid) {
  const owing = DB.clients.map(c => ({c, bills: invoices().filter(b => b.clientId === c.id && balance(b) > 0.5).sort((a, b) => a.date.localeCompare(b.date))}))
    .filter(x => x.bills.length).sort((a, b) => a.c.name.localeCompare(b.c.name));
  if (!owing.length) { toast('No pending payments right now'); return; }
  openModal(`<h2>Money received</h2><form id="rform" novalidate><div id="rerr"></div>
    <div class="form-grid">
      <div class="field full"><label for="r_cl">From which client?</label><select class="input" id="r_cl"><option value="">Choose client…</option>
        ${owing.map(x => `<option value="${x.c.id}" ${x.c.id === cid ? 'selected' : ''}>${esc(x.c.name)} · ${rs(x.bills.reduce((s, b) => s + balance(b), 0))} pending</option>`).join('')}</select></div>
      <div class="full" id="r_bills"></div>
      <div class="field"><label for="r_amt">Amount received (₹)</label><input class="input big" id="r_amt" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
      <div class="field"><label for="r_tds">TDS deducted by client (₹)</label><input class="input" id="r_tds" type="number" inputmode="decimal" min="0" step="any" value="0"><div class="dchips" id="r_tdschip"></div></div>
      <div class="field"><label for="r_date">Date received</label><input class="input" id="r_date" type="date" value="${TODAY}">${dateChips('r_date')}</div>
      <div class="field"><label for="r_ref">Cheque / UTR no. (optional)</label><input class="input" id="r_ref"></div>
      <div class="field full"><span class="field-label">Paid by</span>${radioSeg('r_mode', ['NEFT / RTGS', 'UPI', 'Cheque', 'Cash'], 'NEFT / RTGS')}</div>
    </div>
    <div id="r_sum"></div>${modalFoot('Save payment')}</form>`, true);
  let amtTouched = false, lastBill = null;
  const drawBills = () => {
    const x = owing.find(o => o.c.id === $('#r_cl').value);
    if (!x) { $('#r_bills').innerHTML = ''; return; }
    const pick = x.bills.some(b => b.id === bid) ? bid : x.bills[0].id;
    $('#r_bills').innerHTML = `<span class="field-label">Against which bill?</span>${x.bills.map(b => `<label class="billpick"><input type="radio" name="r_bill" value="${b.id}" ${b.id === pick ? 'checked' : ''}>
      <span class="bp-main"><b>${esc(b.number)}</b><span>${esc(company(b.companyId).short)} · ${dmy(b.date)} · ${esc(b.lines.map(l => l.description).join(', '))}</span></span>
      <span class="bp-r"><b class="t-bad">${rs(balance(b))}</b><small>${daysBetween(b.date, TODAY)} days</small></span></label>`).join('')}`;
  };
  const upd = () => {
    const b = bill(radioVal('r_bill'));
    if (b && b.id !== lastBill) { lastBill = b.id; if (!amtTouched) $('#r_amt').value = r2(balance(b)); }
    const amt = +$('#r_amt').value || 0, tds = +$('#r_tds').value || 0;
    const tdsSuggest = b && company(b.companyId).gst ? r2(calc(b).taxable * 0.02) : 0;
    $('#r_tdschip').innerHTML = tdsSuggest && !received(b) ? `<button type="button" class="dchip" data-tds="${tdsSuggest}">2% TDS = ${rs(tdsSuggest)}</button>` : '';
    if (!b) { $('#r_sum').innerHTML = ''; return; }
    const left = r2(balance(b) - amt - tds);
    $('#r_sum').innerHTML = eq([{label: 'Pending on bill', value: rs(balance(b))}, '−', {label: 'Received now', value: rs(amt + tds), tone: 'good'}, '=', {label: 'Balance pending', value: rs(Math.max(0, left)), tone: left > 0.5 ? 'bad' : 'good'}]);
  };
  drawBills(); upd();
  $('#r_cl').addEventListener('change', () => { bid = null; amtTouched = false; lastBill = null; drawBills(); upd(); });
  $('#rform').addEventListener('input', ev => { if (ev.target.id === 'r_amt') amtTouched = true; upd(); });
  $('#rform').addEventListener('change', ev => { if (ev.target.name === 'r_bill') { amtTouched = false; upd(); } });
  $('#rform').addEventListener('click', ev => {
    const t = ev.target.closest('[data-tds]'); if (!t) return;
    const b = bill(radioVal('r_bill')); $('#r_tds').value = t.dataset.tds;
    if (!amtTouched && b) $('#r_amt').value = r2(balance(b) - +t.dataset.tds);
    upd();
  });
  if (cid) $('#r_amt').focus();
  $('#rform').addEventListener('submit', ev => {
    ev.preventDefault();
    const b = bill(radioVal('r_bill')), amt = +$('#r_amt').value || 0, tds = +$('#r_tds').value || 0;
    if (!b) return showErr('#rerr', 'Choose the client and the bill.');
    if (!(amt > 0)) return showErr('#rerr', 'Enter the amount received.');
    if (amt + tds > balance(b) + 1) return showErr('#rerr', `Only ${rs(balance(b))} is pending on this bill.`);
    if (!$('#r_date').value) return showErr('#rerr', 'Choose the date.');
    b.payments = b.payments || [];
    b.payments.push({id: uid(), date: $('#r_date').value, amount: amt, tds, mode: radioVal('r_mode'), ref: $('#r_ref').value.trim()});
    save(); closeModal(); toast(`${rs(amt)} received from ${client(b.clientId).name}`); router();
  });
}

function salaryForm(e) {
  if (!DB.employees.length) { toast('Add an employee first'); return go('#staff'); }
  const due = e ? Math.max(0, advanceDue(e)) : 0;
  const month = e && e.salaries.some(p => p.month === PREV_MONTH) ? THIS_MONTH : PREV_MONTH;
  openModal(`<h2>Pay salary</h2><form id="sform" novalidate><div id="serr"></div>
    <div class="form-grid">
      <div class="field full"><label for="s_emp">Pay to</label><select class="input" id="s_emp"><option value="">Choose person…</option>
        ${DB.employees.map(x => `<option value="${x.id}" ${e && e.id === x.id ? 'selected' : ''}>${esc(x.name)} · ${esc(x.role)}${x.salaries.some(p => p.month === PREV_MONTH) ? ' · ' + monthName(PREV_MONTH) + ' paid' : ''}</option>`).join('')}</select></div>
      ${e ? `<div class="full">${personCard(e)}</div>
      <div class="field"><label for="s_month">Salary for month</label><input class="input" id="s_month" type="month" value="${month}"></div>
      <div class="field"><label for="s_days">Days worked</label><input class="input" id="s_days" type="number" inputmode="decimal" min="0" step="0.5" value="${daysInMonth(month)}"><span class="hint" id="s_dim"></span></div>
      <div class="field"><label for="s_cut">Advance to adjust (₹)</label><input class="input" id="s_cut" type="number" inputmode="decimal" min="0" step="any" value="${Math.min(due, salaryDue(e).total)}"><span class="hint">Advance taken: ${rs(due)}</span></div>
      <div class="field"><label for="s_paid">Paid on</label><input class="input" id="s_paid" type="date" value="${TODAY}">${dateChips('s_paid')}</div>
      <div class="field full"><span class="field-label">Paid by</span>${radioSeg('s_mode', ['Cash', 'UPI', 'Bank transfer'], 'Cash')}</div>` : ''}
    </div>
    <div id="s_calc"></div>${e ? modalFoot('Save salary') : ''}</form>`, true);
  $('#s_emp').addEventListener('change', ev => salaryForm(employee(ev.target.value)));
  if (!e) return;
  const calcS = () => {
    const m = $('#s_month').value || month, dim = daysInMonth(m), days = Math.min(+$('#s_days').value || 0, dim);
    const earned = Math.round(e.salary * days / dim), allow = Math.round(days * e.allowance), cut = Math.min(+$('#s_cut').value || 0, due);
    $('#s_dim').textContent = `${dim} days in ${monthName(m)}`;
    $('#s_calc').innerHTML = (e.salaries.some(p => p.month === m) ? `<div class="errors" style="margin-top:14px">${monthName(m)} salary is already paid to ${esc(e.name)}.</div>` : '')
      + eq([{label: `Salary · ${days} days`, value: rs(earned)}, ...(allow ? ['+', {label: `Allowance · ${days} × ${rs(e.allowance)}`, value: rs(allow)}] : []), '−', {label: 'Advance taken', value: rs(cut), tone: cut ? 'warn' : ''}, '=', {label: 'To pay', value: rs(earned + allow - cut), tone: 'good', sub: due - cut > 0.5 ? `${rs(due - cut)} advance left for next month` : ''}]);
    return {m, days, earned, allow, cut, net: earned + allow - cut};
  };
  calcS();
  $('#sform').addEventListener('input', ev => { if (ev.target.id !== 's_emp') calcS(); });
  $('#sform').addEventListener('submit', ev => {
    ev.preventDefault(); const r = calcS();
    const err = !r.m ? 'Choose the month.' : e.salaries.some(p => p.month === r.m) ? `${monthName(r.m)} salary is already paid. Delete that entry on ${e.name}'s page to redo it.` : (+$('#s_cut').value || 0) > due + 0.5 ? `Advance pending is only ${rs(due)}.` : r.net < 0 ? 'Advance is more than the salary.' : !(r.days > 0) ? 'Enter days worked.' : '';
    if (err) return showErr('#serr', err);
    e.salaries.push({id: uid(), month: r.m, days: r.days, earned: r.earned, allowanceAmt: r.allow, cut: r.cut, net: r.net, paidOn: $('#s_paid').value, mode: radioVal('s_mode')});
    save(); closeModal(); toast(`${monthName(r.m)} salary ${rs(r.net)} paid to ${e.name}`); router();
  });
}

      <dl class="kv"><dt>Address</dt><dd>${esc(c.address)}</dd><dt>Bank</dt><dd>${esc(c.bankName)} · ${esc(c.bankAc)}</dd><dt>IFSC</dt><dd>${esc(c.ifsc)}</dd><dt>Next invoice</dt><dd>${esc(suggestNumber(c, 'invoice'))}</dd></dl></section>`).join('')}</div>
    <section class="panel"><div class="panel-head"><div><h2>Default terms &amp; conditions</h2><p>Filled into every new document. One point per line. You can still change them on each bill.</p></div></div>
      <form id="terms-form" class="stack" style="gap:14px"><div class="grid2">${Object.keys(TYPE).map(t => `<div class="field"><label for="terms_${t}">${TYPE[t].label}</label><textarea class="input" id="terms_${t}" rows="9">${esc(DB.terms[t])}</textarea></div>`).join('')}</div>
      <div class="actions"><button class="btn primary">Save terms</button></div></form>
    </section>
    <section class="panel"><div class="panel-head"><div><h2>Your data</h2><p>Everything is saved inside this browser on this computer. Take a backup every week.</p></div></div>
      <div class="actions"><button class="btn primary" data-act="backup">Download backup</button><label class="btn" for="restore-file">Restore from backup</label><input type="file" id="restore-file" accept=".json,application/json" hidden><button class="btn danger" data-act="reset">Reset to demo data</button></div>
    </section>
  </div>`;
  $('#terms-form').addEventListener('submit', ev => {
    ev.preventDefault(); Object.keys(TYPE).forEach(t => { DB.terms[t] = $('#terms_' + t).value.trim(); }); save(); toast('Default terms saved');
  });
  $('#restore-file').addEventListener('change', ev => {
    const f = ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d.companies || !d.bills || !d.clients) throw 0; DB = migrate(d); save(); toast('Backup restored'); router(); } catch (e) { toast('That file is not a Ravi Kiran Ops backup.'); } };
    rd.readAsText(f);
  });
}
function companyForm(c) {
  openForm({title: 'Edit ' + c.short, fields: [
    {id: 'name', label: 'Name on bill', value: c.name, required: true, full: true},
    {id: 'address', label: 'Address', value: c.address, full: true},
    {id: 'tagline', label: 'Business line', value: c.tagline, full: true},
    {id: 'contact', label: 'Contact no.', value: c.contact}, {id: 'email', label: 'Email', value: c.email},
    {id: 'gst', label: 'GST registered?', type: 'select', options: [['yes', 'Yes – charge GST'], ['no', 'No – bill without GST']], value: c.gst ? 'yes' : 'no'},
    {id: 'gstin', label: 'GSTIN', value: c.gstin}, {id: 'pan', label: 'PAN', value: c.pan}, {id: 'sac', label: 'HSN / SAC code', value: c.sac},
    {id: 'prefix', label: 'Bill number prefix', value: c.prefix, required: true},
    {id: 'bankName', label: 'Bank name', value: c.bankName}, {id: 'bankAc', label: 'Account no.', value: c.bankAc}, {id: 'ifsc', label: 'IFSC', value: c.ifsc},
  ], onSubmit: v => {
    if (v.gst === 'yes' && !v.gstin) return 'Enter the GSTIN, or set GST registered to No.';
    Object.assign(c, v, {gst: v.gst === 'yes', gstin: v.gstin.toUpperCase()}); save(); toast('Company details saved'); router();
  }});
}

/* ---------------- global events ---------------- */
let presetClient = null;
main.addEventListener('input', e => { if (e.target.dataset.f && draft && onEditorInput(e.target)) drawTotals(); });
main.addEventListener('change', e => { if (e.target.dataset.f && draft) { onEditorInput(e.target); onEditorChange(e.target); } });
document.addEventListener('click', e => {
  const presetLink = e.target.closest('[data-preset-client]');
  if (presetLink) presetClient = presetLink.dataset.presetClient;
  const dc = e.target.closest('[data-date-for]');
  if (dc) { const inp = document.getElementById(dc.dataset.dateFor); inp.value = dc.dataset.date; inp.dispatchEvent(new Event('input', {bubbles: true})); return; }
  const row = e.target.closest('tr[data-href]');
  if (row && !e.target.closest('button,a')) { go(row.dataset.href); return; }
  const fb = e.target.closest('[data-filter]');
  if (fb) { billFilter[fb.dataset.filter] = fb.dataset.val; if (location.hash !== '#bills') { history.replaceState(null, '', '#bills'); } renderBills(); return; }
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const {act, id} = btn.dataset;
  const d = draft;
  switch (act) {
    // editor
    case 'set-type': {
      const old = d.type, nt = btn.dataset.val; if (old === nt) break;
      d.type = nt;
      if (nt !== 'invoice') collapseEntries(d);
      if ((d.terms || '') === (DB.terms[old] || '')) d.terms = DB.terms[nt];
      if (nt === 'quotation' && !d.subject) d.subject = DEFAULT_SUBJECT;
      if (d._isNew && !d._numTouched) d.number = suggestNumber(company(d.companyId), nt);
      drawEditor(); break;
    }
    case 'reset-terms': d.terms = DB.terms[d.type]; drawEditor(); break;
    case 'save-print': saveDraft(true); break;
    case 'add-line': d.lines.push(blankLine(d.type)); drawEditor(); break;
    case 'del-line': d.lines.splice(+btn.dataset.l, 1); drawEditor(); break;
    case 'add-entry': {
      const l = d.lines[+btn.dataset.l], last = l.entries[l.entries.length - 1] || {};
      l.entries.push({date: last.date ? addDays(last.date, 1) : (d.type === 'quotation' ? '' : TODAY), challan: /^\d+$/.test(last.challan || '') ? String(+last.challan + 1) : '', qty: ''});
      drawEditor();
      const q = main.querySelector(`[data-f="lines.${btn.dataset.l}.entries.${l.entries.length - 1}.qty"]`); if (q) q.focus();
      break;
    }
    case 'del-entry': d.lines[+btn.dataset.l].entries.splice(+btn.dataset.e, 1); drawEditor(); break;
    case 'save': saveDraft(false); break;
    case 'quick-client': clientForm(null, c => { d.clientId = c.id; d.siteId = c.sites[0]?.id || ''; drawEditor(); }); break;
    // bills
    case 'print': printBill(id); break;
    case 'pay': receiveMoneyForm(bill(id).clientId, id); break;
    case 'receive': receiveMoneyForm(id || undefined); break;
    case 'convert': convertBill(id, btn.dataset.to); break;
    case 'del-pay': { const b = bill(id); confirmBox('Remove this payment?', 'The bill will show this amount as pending again.', 'Remove payment', () => { b.payments = b.payments.filter(p => p.id !== btn.dataset.p); save(); toast('Payment removed'); router(); }); break; }
    case 'del-bill': { const b = bill(id); confirmBox(`Delete ${b.number}?`, 'This bill and its payments will be removed. This cannot be undone.', 'Delete bill', () => {
      DB.bills = DB.bills.filter(x => x.id !== id); DB.bills.forEach(x => { if (x.convertedTo) x.convertedTo = x.convertedTo.filter(k => k !== id); if (x.convertedFrom === id) delete x.convertedFrom; }); save(); toast('Bill deleted'); go('#bills'); }); break; }
    case 'view': {
      const val = btn.dataset.val, k = id[0], rid = id.slice(1);
      pageView[id] = k === 'e' && pageView[id] === val ? 'all' : val;
      if (k === 'c') renderClient(rid); else if (k === 'v') renderVehicle(rid); else renderEmployee(rid);
      break;
    }
    case 'pay-period': payPeriod = btn.dataset.val; renderPayments(); break;
    case 'csv-payments': downloadCSV(`payments-${TODAY}.csv`, [['Date', 'Client', 'Bill', 'Paid by', 'Reference', 'Amount', 'TDS', 'Total'],
      ...paymentsIn(payPeriod).map(({p, b}) => [dmy(p.date), client(b.clientId)?.name, b.number, p.mode, p.ref, p.amount, +p.tds || 0, (+p.amount || 0) + (+p.tds || 0)])]); break;
    case 'csv-bills': downloadCSV(`bills-${TODAY}.csv`, [['Type', 'Number', 'Date', 'Company', 'Client', 'Site', 'Work', 'Transport', 'Diesel', 'Taxable', 'GST', 'Grand Total', 'Received', 'Pending', 'Status'],
      ...DB.bills.map(b => { const c = calc(b), cl = client(b.clientId); return [typeLabel(b), b.number, dmy(b.date), company(b.companyId).short, cl?.name, siteOf(cl, b.siteId)?.name, c.sub, c.transport, c.diesel, c.taxable, r2(c.cgst + c.sgst + c.igst), c.grand, b.type === 'invoice' ? received(b) : '', b.type === 'invoice' ? balance(b) : '', billStatus(b)[0]]; })]); break;
    // clients
    case 'add-client': clientForm(null); break;
    case 'edit-client': clientForm(client(id)); break;
    case 'del-client': { const c = client(id), n = DB.bills.filter(b => b.clientId === id).length;
      if (n) { toast(`${c.name} has ${pl(n, 'bill', 'bills')}. Delete those first.`); break; }
      confirmBox(`Delete ${c.name}?`, 'The client and their sites will be removed.', 'Delete client', () => { DB.clients = DB.clients.filter(x => x.id !== id); save(); toast('Client deleted'); go('#clients'); }); break; }
    case 'del-site': { const c = client(id), s = btn.dataset.s, n = DB.bills.filter(b => b.siteId === s).length;
      if (n) { toast(`This site is on ${pl(n, 'bill', 'bills')}, so it can't be removed.`); break; }
      c.sites = c.sites.filter(x => x.id !== s); save(); toast('Site removed'); renderClient(id); break; }
    // vehicles
    case 'add-vehicle': vehicleForm(null); break;
    case 'diesel': dieselForm(null); break;
    case 'diesel-one': dieselForm(vehicle(id)); break;
    case 'veh-period': vehPeriod = btn.dataset.val; router(); break;
    case 'del-diesel': confirmBox('Remove this diesel entry?', 'Use this only if it was entered by mistake.', 'Remove', () => { DB.diesel = DB.diesel.filter(f => f.id !== id); save(); router(); }); break;
    case 'csv-diesel': downloadCSV(`diesel-${TODAY}.csv`, [['Date', 'Vehicle', 'Litres', 'Price per litre', 'Amount', 'Meter', 'Pump / place', 'Paid by'],
      ...DB.diesel.filter(f => inPeriod(f.date, vehPeriod)).sort((a, b) => a.date.localeCompare(b.date)).map(f => [dmy(f.date), vehicleLabel(vehicle(f.vehicleId)), f.litres, f.rate, f.amount, f.meter, f.where, f.mode])]); break;
    case 'edit-vehicle': vehicleForm(vehicle(id)); break;
    case 'del-vehicle': { const v = vehicle(id), n = vehicleUse(id).length;
      if (n) { toast(`${vehicleLabel(v)} is on ${pl(n, 'bill', 'bills')}, so it can't be deleted. Mark it Idle instead.`); break; }
      confirmBox(`Delete ${vehicleLabel(v)}?`, 'The vehicle will be removed from the list.', 'Delete vehicle', () => { DB.vehicles = DB.vehicles.filter(x => x.id !== id); DB.employees.forEach(e => { if (e.vehicleId === id) e.vehicleId = ''; }); save(); toast('Vehicle deleted'); go('#vehicles'); }); break; }
    case 'csv-vehicles': downloadCSV(`vehicles-${TODAY}.csv`, [['Vehicle', 'Number', 'Type', 'Company', 'Charged per', 'Rate', 'Status', 'Site', 'Operator', 'Work billed', 'Amount billed', 'Diesel litres', 'Diesel ₹', 'Average L per hr/day', 'Left after diesel'],
      ...DB.vehicles.map(v => { const u = vehicleUse(v.id); return [v.name, v.regNo, v.type, company(v.companyId)?.short, v.unit, v.rate, v.status, v.site, employee(v.operatorId)?.name, r2(u.reduce((s, x) => s + x.qty, 0)), r2(u.reduce((s, x) => s + x.amt, 0)), (st => [st.litres, st.cost, st.avg, st.after])(vstats(v.id, 'all'))].flat(); })]); break;
    // staff
    case 'add-emp': employeeForm(null); break;
    case 'edit-emp': employeeForm(employee(id)); break;
    case 'del-emp': { const e = employee(id); confirmBox(`Delete ${e.name}?`, 'Their salary and advance history will be removed too.', 'Delete employee', () => { DB.employees = DB.employees.filter(x => x.id !== id); DB.vehicles.forEach(v => { if (v.operatorId === id) v.operatorId = ''; }); save(); toast('Employee deleted'); go('#staff'); }); break; }
    case 'advance': giveAdvanceForm(null); break;
    case 'salary': salaryForm(null); break;
    case 'advance-one': giveAdvanceForm(employee(id)); break;
    case 'salary-one': salaryForm(employee(id)); break;
    case 'del-adv': { const e = employee(id); confirmBox('Remove this advance?', 'Use this only if it was entered by mistake.', 'Remove', () => { e.advances = e.advances.filter(a => a.id !== btn.dataset.x); save(); router(); }); break; }
    case 'del-sal': { const e = employee(id); confirmBox('Remove this salary entry?', 'Any advance deducted in it will show as pending again.', 'Remove', () => { e.salaries = e.salaries.filter(p => p.id !== btn.dataset.x); save(); router(); }); break; }
    case 'csv-staff': downloadCSV(`employees-${TODAY}.csv`, [['Name', 'Work', 'Phone', 'Vehicle', 'Monthly salary', 'Daily allowance', 'Advance taken', 'To pay', 'For month', 'Joined'],
      ...DB.employees.map(e => { const d = salaryDue(e); return [e.name, e.role, e.phone, vehicleLabel(vehicle(e.vehicleId)), e.salary, e.allowance, d.adv, d.toPay, monthName(d.m), dmy(e.joined)]; })]); break;
    // settings
    case 'edit-co': companyForm(company(id)); break;
    case 'backup': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 1)], {type: 'application/json'}));
      a.download = `ravi-kiran-backup-${TODAY}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('Backup downloaded'); break;
    }
    case 'reset': confirmBox('Reset to demo data?', 'Everything you entered will be replaced with the sample data. Download a backup first if you need it.', 'Reset', () => { DB = migrate(seed()); save(); toast('Demo data loaded'); go('#'); router(); }); break;
  }
});
// "+ New bill" from a client page pre-selects that client
window.addEventListener('hashchange', () => {
  if (presetClient && draft && draft._isNew) { const c = client(presetClient); if (c) { draft.clientId = c.id; draft.siteId = c.sites[0]?.id || ''; drawEditor(); } }
  presetClient = null;
});

router();
</script>
